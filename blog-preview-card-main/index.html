<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />

    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body>
    <main>
      <article class="card">
        <!-- Top illustration -->
        <img
          class="card__image"
          src="./assets/images/illustration-article.svg"
          alt="Illustration of HTML and CSS code concepts"
        />

        <!-- Card body -->
        <div class="card__content">
          <!-- Category badge -->
          <span class="card__badge">Learning</span>

          <!-- Published date -->
          <p class="card__date">Published 21 Dec 2023</p>

          <!-- Article title — has hover & focus state -->
          <h2 class="card__title">HTML &amp; CSS foundations</h2>

          <!-- Description -->
          <p class="card__description">
            These languages are the backbone of every website, defining
            structure, content, and presentation.
          </p>

          <!-- Author row -->
          <div class="card__author">
            <img
              class="card__avatar"
              src="./assets/images/image-avatar.webp"
              alt="Photo of Greg Hooper"
            />
            <span class="card__author-name">Greg Hooper</span>
          </div>
        </div>
      </article>
    </main>

    <!-- Attribution — hidden in CSS, kept for credit -->
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded
