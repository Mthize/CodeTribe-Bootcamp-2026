<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-container">
    <section class="card">
      <h1>Signup Portal</h1>
      <p class="intro-text">Complete the signup form, test the timing event, and explore the JavaScript demos below.</p>

      <section class="section-block">
        <h2>Signup Form</h2>

        <form id="signupForm">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter your username">
            <span id="usernameError" class="error-message"></span>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="text" id="email" placeholder="Enter your email">
            <span id="emailError" class="error-message"></span>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password">
            <span id="passwordError" class="error-message"></span>
          </div>

          <div class="checkbox-group">
            <input type="checkbox" id="terms">
            <label for="terms">I agree to the terms and conditions</label>
          </div>
          <span id="termsError" class="error-message"></span>

          <button type="submit" class="primary-button">Submit Signup</button>
          <p id="successMessage" class="success-message"></p>
        </form>
      </section>

      <section class="section-block">
        <h2>Verification Button</h2>
        <p class="helper-text">The button becomes available after the countdown reaches zero.</p>
        <button id="resendButton" class="secondary-button" disabled>Resend Verification in 10s</button>
        <p id="verificationMessage" class="success-message"></p>
      </section>

      <section class="section-block">
        <h2>Synchronous JavaScript Demo</h2>
        <button id="runSyncButton" class="secondary-button">Run Synchronous Demo</button>
        <div id="syncOutput" class="output-box"></div>
      </section>

      <section class="section-block">
        <h2>Student Database</h2>
        <button id="loadStudentsButton" class="secondary-button">Load Students After 3 Seconds</button>
        <p id="studentStatus" class="helper-text"></p>
        <div id="studentOutput" class="student-list"></div>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
